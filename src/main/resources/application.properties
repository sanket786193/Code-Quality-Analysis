# ===============================
# Database Configuration
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ai_code_review}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.application.name=ai-code-review-platform


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Security Configuration
# ===============================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===============================
# GitHub OAuth2 Configuration
# ===============================
app.oauth2.github.client-id=${GITHUB_CLIENT_ID:dummy_github_client_id}
app.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:dummy_github_client_secret}
app.oauth2.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/github/callback}

# ===============================
# GitHub App & Webhook Configuration
# ===============================
app.github.app-name=${GITHUB_APP_NAME:ai-code-review-assistant}
app.github.app-id=${GITHUB_APP_ID:123456}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:dev_webhook_secret_key}
app.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}