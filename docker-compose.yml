services:
  postgres:
    image: postgres:16
    container_name: ai-code-review-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_code_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Port 5434 is mapped to host because 5432 is used by Windows PostgreSQL service
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_code_review"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
